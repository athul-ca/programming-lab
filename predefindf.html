        body

        <body>
            <script>
                document.write("<h2>predefind functions of  string and math object</h2>")

                document.write("Rounding a numbrer using Math.round",+num);
                var str="Hello World";
                document.write("<br>")

                var c=50.65
                var x=Math.ceil(c)
                document.write("<br>Value of"+c+"after using Math.ceil is:"+x);
                var lw="web programming";
                document.write("<br>"+lw+"to uppercase:"+lw.toUpperCase());
                var power=Math.pow(3,2);
                document.write("<br>Math.pow(3,2)gives:"+power);
                </script>
